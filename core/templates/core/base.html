{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Necesario para que el celular use el ancho real de la pantalla (sin esto todo se ve diminuto) -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Óptica IC{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tus estilos -->
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>

    {% include 'core/navbar.html' %}

    <div class="container mt-4">
        {% block content %}

        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const csrftoken = "{{ csrf_token }}";
    </script>

    <!-- Envuelve automáticamente las tablas para que hagan scroll horizontal en el celular -->
    <script src="{% static 'core/js/responsive.js' %}"></script>

</body>
</html>
