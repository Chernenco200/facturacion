<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Registrar servicio de tercero
    </title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            color: #243447;
        }

        .contenedor {
            max-width: 850px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .tarjeta {
            background: white;
            border-radius: 10px;
            padding: 25px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .resumen {
            background: #eaf1f5;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 22px;
        }

        .fila {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;

            border:
                1px solid #d0d5dd;

            border-radius: 6px;

            box-sizing: border-box;
        }

        .acciones {
            margin-top: 25px;

            display: flex;
            justify-content: flex-end;
        }

        button {
            background: #285f7d;
            color: white;

            border: none;
            border-radius: 6px;

            padding: 11px 20px;

            cursor: pointer;
        }

        .mensaje {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .error {
            background: #fee4e2;
            color: #b42318;
        }

        .success {
            background: #dcfae6;
            color: #16794b;
        }

    </style>

</head>


<body>

<div class="contenedor">

    <h1>
        Registrar servicio de tercero
    </h1>


    {% for message in messages %}

        <div
            class="
                mensaje
                {% if message.tags == 'error' %}
                    error
                {% else %}
                    success
                {% endif %}
            "
        >
            {{ message }}
        </div>

    {% endfor %}


    <div class="tarjeta">

        <div class="resumen">

            <strong>
                Ticket
                {{ servicio.propuesta.ticket.numero|stringformat:"06d" }}
            </strong>

            <br><br>

            Servicio:

            <strong>
                {{ servicio.get_tipo_servicio_display }}
            </strong>

        </div>


        <form method="post">

            {% csrf_token %}


            <div class="fila">

                <label>
                    Proveedor
                </label>

                <input
                    type="text"
                    name="proveedor_nombre"
                    required
                    value="{{ servicio.proveedor_nombre }}"
                >

            </div>


            <div class="fila">

                <label>
                    Fecha del servicio
                </label>

                <input
                    type="date"
                    name="fecha_servicio"
                    required
                    value="{% if servicio.fecha_servicio %}{{ servicio.fecha_servicio|date:'Y-m-d' }}{% endif %}"
                >

            </div>


            <div class="fila">

                <label>
                    Costo
                </label>

                <input
                    type="number"
                    step="0.01"
                    min="0.01"
                    name="costo"
                    required
                    value="{{ servicio.costo }}"
                >

            </div>


            <div class="fila">

                <label>
                    Forma de pago
                </label>

                <select
                    name="forma_pago"
                    id="forma_pago"
                    required
                >

                    <option value="EFECTIVO">
                        Efectivo
                    </option>

                    <option value="BANCO">
                        Banco / transferencia
                    </option>

                    <option value="CREDITO">
                        Crédito proveedor
                    </option>

                    <option value="OTRO">
                        Otro
                    </option>

                </select>

            </div>


            <div
                class="fila"
                id="bloque_pago"
            >

                <label>
                    Cuenta de pago
                </label>

                <select name="cuenta_pago">

                    <option value="">
                        Seleccione
                    </option>

                    {% for cuenta in cuentas_pago %}

                        <option value="{{ cuenta.id }}">
                            {{ cuenta.codigo }}
                            -
                            {{ cuenta.nombre }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div
                class="fila"
                id="bloque_proveedor"
            >

                <label>
                    Cuenta por pagar
                </label>

                <select name="cuenta_proveedor">

                    <option value="">
                        Seleccione
                    </option>

                    {% for cuenta in cuentas_proveedor %}

                        <option value="{{ cuenta.id }}">
                            {{ cuenta.codigo }}
                            -
                            {{ cuenta.nombre }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="acciones">

                <button type="submit">
                    Guardar servicio
                </button>

            </div>

        </form>

    </div>

</div>


<script>

    const formaPago =
        document.getElementById("forma_pago");

    const bloquePago =
        document.getElementById("bloque_pago");

    const bloqueProveedor =
        document.getElementById("bloque_proveedor");


    function actualizarFormaPago() {

        if (formaPago.value === "CREDITO") {

            bloquePago.style.display = "none";
            bloqueProveedor.style.display = "block";

        } else {

            bloquePago.style.display = "block";
            bloqueProveedor.style.display = "none";

        }

    }


    formaPago.addEventListener(
        "change",
        actualizarFormaPago
    );

    actualizarFormaPago();

</script>

</body>

</html>
